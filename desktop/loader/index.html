<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>InsightForge</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0b1220; color: #e2e8f0;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  .card { text-align: center; max-width: 420px; padding: 40px; }
  .logo {
    width: 72px; height: 72px; margin: 0 auto 24px; border-radius: 16px;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; font-weight: 700; color: white;
  }
  h1 { font-size: 24px; margin-bottom: 8px; }
  p.sub { color: #94a3b8; font-size: 14px; margin-bottom: 32px; }
  .spinner {
    width: 28px; height: 28px; margin: 0 auto; border-radius: 50%;
    border: 3px solid #1e293b; border-top-color: #3b82f6;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none; }
  #error { color: #f87171; font-size: 15px; line-height: 1.6; }
  button {
    margin-top: 24px; padding: 10px 28px; border: none; border-radius: 8px;
    background: #3b82f6; color: white; font-size: 15px; cursor: pointer;
  }
  button:hover { background: #2563eb; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">IF</div>
    <h1>InsightForge</h1>
    <p class="sub">Connecting to your workspace&hellip;</p>
    <div id="loading"><div class="spinner"></div></div>
    <div id="error" class="hidden">
      <p>Could not reach InsightForge.<br/>Check your internet connection and try again.</p>
      <button onclick="connect()">Retry</button>
    </div>
  </div>
<script>
  const APP_URL = "https://insights-forge-aie6.vercel.app/";
  async function connect() {
    document.getElementById("error").classList.add("hidden");
    document.getElementById("loading").classList.remove("hidden");
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 12000);
    try {
      // no-cors: opaque response is fine — we only need reachability.
      await fetch(APP_URL, { mode: "no-cors", signal: controller.signal });
      window.location.replace(APP_URL);
    } catch (e) {
      document.getElementById("loading").classList.add("hidden");
      document.getElementById("error").classList.remove("hidden");
    } finally {
      clearTimeout(timer);
    }
  }
  connect();
</script>
</body>
</html>
